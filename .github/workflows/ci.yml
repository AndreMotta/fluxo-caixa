name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      carga:
        description: "Rodar o teste de carga (k6, ~3 min)"
        type: boolean
        default: false

# Token do workflow só com leitura; actions fixadas por SHA (não por tag mutável).
permissions:
  contents: read

jobs:
  seguranca:
    name: Segurança (segredos, dependências, imagens)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Segredos versionados (gitleaks)
        run: make segredos
      - name: CVEs nas dependências (pip-audit)
        run: make auditoria-deps
      - name: CVEs nas imagens (Trivy, bloqueia CRITICAL)
        run: make auditoria-imagens

  testes:
    name: Testes unitários e de API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lançamentos
        run: docker build --target test services/lancamentos
      - name: Consolidado
        run: docker build --target test services/consolidado

  e2e:
    name: E2E, resiliência e carga
    runs-on: ubuntu-latest
    needs: [testes, seguranca]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configurar .env de CI (pares de chaves novos por execução)
        run: make env
      - name: Subir ambiente
        run: make up && make aguardar
      - name: Ponta a ponta
        run: make e2e
      - name: Resiliência (consolidado e broker fora do ar)
        run: make resiliencia
      - name: Carga (50 e 100 req/s)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.carga }}
        run: make carga
      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Derrubar
        if: always()
        run: docker compose down -v
