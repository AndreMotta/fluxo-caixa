# API Gateway local (em produção: Azure API Management + Front Door/WAF — ver docs/03).
worker_processes auto;

events {
    worker_connections 2048;
}

http {
    server_tokens off;

    log_format json escape=json
        '{"ts":"$time_iso8601","request_id":"$request_id","remote":"$remote_addr",'
        '"method":"$request_method","uri":"$uri","status":$status,'
        '"request_time":$request_time,"upstream":"$upstream_addr",'
        '"upstream_time":"$upstream_response_time"}';
    access_log /dev/stdout json;
    error_log /dev/stderr warn;

    # Limites defensivos de entrada
    client_max_body_size 16k;
    client_body_timeout 5s;
    client_header_timeout 5s;
    keepalive_timeout 30s;

    # Rate limiting por IP (em produção: quota por client_id/assinatura no APIM).
    # Leitura dimensionada para o pico de 50 req/s com folga de 2x.
    limit_req_zone $binary_remote_addr zone=leitura:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=escrita:10m rate=50r/s;
    limit_req_status 429;

    # Resolução dinâmica pelo DNS do Docker: o nome devolve todas as réplicas (round-robin)
    # e o gateway sobe mesmo se um serviço estiver fora (isolamento de falha na borda).
    resolver 127.0.0.11 valid=5s ipv6=off;

    server {
        listen 8080;

        set $lancamentos http://lancamentos:8000;
        set $consolidado http://consolidado:8000;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Request-ID $request_id always;
        # Com TLS na borda: add_header Strict-Transport-Security "max-age=31536000" always;

        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 1s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;

        location /v1/lancamentos {
            limit_req zone=escrita burst=100 nodelay;
            # POST não é repetido em outra réplica (não idempotente para o proxy);
            # o cliente reenvia com a mesma Idempotency-Key.
            proxy_pass $lancamentos;
        }

        location /v1/consolidado {
            limit_req zone=leitura burst=100 nodelay;
            # GET é idempotente: se uma réplica falhar, tenta a próxima (reduz perda no pico).
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
            proxy_pass $consolidado;
        }

        # Swagger/OpenAPI de cada serviço (ambiente local).
        location /lancamentos/ { proxy_pass $lancamentos; }
        location /consolidado/ { proxy_pass $consolidado; }

        location = /health {
            default_type text/plain;
            return 200 "ok\n";
        }

        # /metrics, /health/* dos serviços e qualquer outra rota NÃO são expostos na borda.
        location / {
            return 404;
        }
    }
}
