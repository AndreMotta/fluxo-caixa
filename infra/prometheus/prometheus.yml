global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  # dns_sd descobre todas as réplicas de cada serviço.
  - job_name: lancamentos
    dns_sd_configs:
      - names: [lancamentos]
        type: A
        port: 8000

  - job_name: consolidado
    dns_sd_configs:
      - names: [consolidado]
        type: A
        port: 8000

  - job_name: rabbitmq
    metrics_path: /metrics/per-object   # métricas por fila (inclui a DLQ)
    static_configs:
      - targets: ["rabbitmq:15692"]
